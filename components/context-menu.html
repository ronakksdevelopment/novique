<!--
  COMPONENT: Custom Right-Click Context Menu
  ============================================
  Reference copy of the custom context-menu markup used in index.html.
  Replaces the browser's default right-click menu site-wide.

  Depends on:
    - assets/css/style.css   (.custom-context-menu, .ccm-*)
    - assets/js/main.js      (open/close/position logic, long-press support,
                               menu item actions: home / portfolio / contact /
                               copy-link / reload / back-to-top)
    - Font Awesome            for the menu icons

  Required IDs referenced by main.js:
    #customContextMenu, #ccmToast, #ccmToastText
-->
<!-- ============ CUSTOM RIGHT-CLICK CONTEXT MENU ============ -->
<div class="custom-context-menu" id="customContextMenu" role="menu" aria-hidden="true">
  <div class="ccm-brand">
    <img src="assets/images/logo.png" alt="">
    <span>NoviQue</span>
  </div>
  <ul class="ccm-list">
    <li><button class="ccm-item" data-action="home" role="menuitem"><i class="fa-solid fa-house" aria-hidden="true"></i> Go to Home</button></li>
    <li><button class="ccm-item" data-action="portfolio" role="menuitem"><i class="fa-solid fa-briefcase" aria-hidden="true"></i> View Portfolio</button></li>
    <li><button class="ccm-item" data-action="contact" role="menuitem"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Start a Project</button></li>
    <li class="ccm-divider" role="separator"></li>
    <li><button class="ccm-item" data-action="copy-link" role="menuitem"><i class="fa-solid fa-link" aria-hidden="true"></i> Copy Page Link</button></li>
    <li><button class="ccm-item" data-action="reload" role="menuitem"><i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i> Reload Page</button></li>
    <li class="ccm-divider" role="separator"></li>
    <li><button class="ccm-item" data-action="top" role="menuitem"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i> Back to Top</button></li>
  </ul>
</div>
<div class="ccm-toast" id="ccmToast"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> <span id="ccmToastText">Done</span></div>
